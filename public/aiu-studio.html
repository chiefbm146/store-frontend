<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation Studio - A.I.U.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎓</text></svg>">

    <!-- Dependencies -->
    <link rel="stylesheet" href="/css/aiu-main.css">
    <link rel="stylesheet" href="/css/aiu-studio.css">
    <script defer src="/__/firebase/12.4.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.4.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="/js/aiu-studio.js"></script>
</head>
<body>

    <!-- Initial loader while checking authentication -->
    <div id="auth-loading" class="fullscreen-loader">
        <div class="spinner" style="width: 40px; height: 40px;"></div>
        <p>Verifying your session...</p>
    </div>

    <!-- Main studio content, hidden by default -->
    <main id="studio-content" class="studio-container" style="display: none;">

        <!-- Left Panel: Chat with the Architect AI -->
        <section class="studio-panel">
            <header class="panel-header">
                <span class="panel-icon">💬</span>
                <h2>Persona Architect</h2>
            </header>
            <div class="chat-history" id="studio-chat-history">
                <div class="chat-bubble ai-bubble">
                    Hello! Let's begin creating your AI persona. To start, tell me a little bit about yourself. What are your core values or passions? What is your expertise?
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="studio-user-input" placeholder="Your response... (Press Enter to send, Shift+Enter for new line)"></textarea>
                <button id="studio-send-btn" class="btn btn-primary">Send Message</button>
            </div>
        </section>

        <!-- Right Panel: Live Persona Document -->
        <section class="studio-panel document-panel">
            <header class="panel-header">
                <span class="panel-icon">📝</span>
                <h2>Your Persona Document (Live Draft)</h2>
            </header>
            <div class="panel-body">
                <textarea id="persona-document-draft" placeholder="As you chat, your persona document will be drafted here..."></textarea>
                
                <div class="finalization-controls">
                    <div class="form-group">
                        <label for="ai-username">Choose a unique, public username for your AI:</label>
                        <input type="text" id="ai-username" class="form-input" placeholder="e.g., korypeters (no spaces)">
                    </div>
                    <button id="finalize-btn" class="btn btn-primary" style="width: 100%; background: var(--aiu-accent);">
                        ✅ Looks Good, A.I. Yourself!
                    </button>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
