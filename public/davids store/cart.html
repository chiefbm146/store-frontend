<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/js/device-detector.js"></script>
    <script src="/js/clean-url.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Sxexet Spath (David Peters)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #FFFFFF;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* NAVIGATION */
        .nav-bar {
            background: rgba(45, 74, 62, 0.98);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            border-bottom: 1px solid rgba(201, 169, 98, 0.2);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #C9A962;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .nav-back:hover {
            background: rgba(201, 169, 98, 0.1);
            transform: translateX(-4px);
        }

        .nav-title {
            color: #FFFFFF;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-spacer {
            width: 120px;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .cart-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .cart-subtitle {
            font-size: 1.1rem;
            color: #666;
        }

        /* LAYOUT */
        .cart-wrapper {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            min-height: calc(100vh - 200px);
        }

        /* CART ITEMS */
        .cart-items {
            background: #F8F9FA;
            border-radius: 16px;
            padding: 30px;
        }

        .items-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #E9ECEF;
        }

        .cart-item {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            border: 2px solid #E9ECEF;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            border-color: #2D4A3E;
            box-shadow: 0 4px 16px rgba(45, 74, 62, 0.1);
        }

        .item-icon {
            font-size: 3rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .item-type {
            display: inline-block;
            padding: 4px 12px;
            background: #2D4A3E;
            color: #FFFFFF;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .item-option {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 12px;
        }

        .item-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2D4A3E;
        }

        .item-remove {
            padding: 10px 16px;
            background: transparent;
            border: 2px solid #E9ECEF;
            border-radius: 8px;
            color: #dc3545;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
            flex-shrink: 0;
        }

        .item-remove:hover {
            border-color: #dc3545;
            background: #FFEBEE;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .empty-text {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 30px;
        }

        .continue-shopping {
            display: inline-block;
            padding: 14px 32px;
            background: #2D4A3E;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .continue-shopping:hover {
            background: #1a3a2a;
            transform: translateY(-2px);
        }

        /* ORDER SUMMARY */
        .order-summary {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 30px;
            border: 2px solid #E9ECEF;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #E9ECEF;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            color: #1a1a1a;
            font-weight: 600;
        }

        .summary-divider {
            height: 2px;
            background: #E9ECEF;
            margin: 20px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: 800;
            color: #2D4A3E;
            margin-bottom: 25px;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px 24px;
            background: #C9A962;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(201, 169, 98, 0.3);
        }

        .checkout-btn:hover {
            background: #d4b872;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 169, 98, 0.4);
        }

        .checkout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .continue-btn {
            width: 100%;
            padding: 12px 24px;
            background: transparent;
            color: #2D4A3E;
            border: 2px solid #2D4A3E;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background: #2D4A3E;
            color: #FFFFFF;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .cart-wrapper {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }

            .nav-spacer {
                display: none;
            }

            .container {
                padding: 20px 15px;
            }

            .cart-title {
                font-size: 2rem;
            }

            .cart-item {
                flex-direction: column;
            }

            .item-icon {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="/offerings" class="nav-back">← Continue Shopping</a>
            <h1 class="nav-title">🌿 Shopping Cart</h1>
            <div class="nav-spacer"></div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="cart-header">
            <h2 class="cart-title">Your Cart</h2>
            <p class="cart-subtitle" id="cart-subtitle"></p>
        </div>

        <div class="cart-wrapper">
            <!-- Cart Items -->
            <div class="cart-items" id="cart-items-container">
                <!-- Items will be populated by JS -->
            </div>

            <!-- Order Summary -->
            <div class="order-summary">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span class="summary-label">Subtotal</span>
                    <span class="summary-value" id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Tax</span>
                    <span class="summary-value" id="tax">$0.00</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                <button class="checkout-btn" id="checkout-btn" disabled style="opacity: 0.6; cursor: not-allowed;">
                    Coming Soon
                </button>
                <button class="continue-btn" onclick="continueShopping()">
                    Continue Shopping
                </button>
            </div>
        </div>
    </div>

    <script src="/workshop-data.js"></script>
    <script>
        // Cart Management
        const CART_KEY = 'sxexet_cart';

        function getCart() {
            const cart = localStorage.getItem(CART_KEY);
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function removeFromCart(itemId) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== itemId);
            saveCart(cart);
            renderCart();
        }

        function calculateTotals() {
            const cart = getCart();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = Math.round(subtotal * 0.05); // 5% tax
            const total = subtotal + tax;

            return {
                subtotal: subtotal / 100,
                tax: tax / 100,
                total: total / 100
            };
        }

        function formatPrice(cents) {
            return '$' + (cents / 100).toFixed(2);
        }

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal');
            const taxEl = document.getElementById('tax');
            const totalEl = document.getElementById('total');
            const cartSubtitle = document.getElementById('cart-subtitle');
            const checkoutBtn = document.getElementById('checkout-btn');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛒</div>
                        <h3 class="empty-title">Your cart is empty</h3>
                        <p class="empty-text">Add products or workshops to get started</p>
                        <a href="/offerings" class="continue-shopping">Browse Products & Workshops</a>
                    </div>
                `;
                cartSubtitle.textContent = '';
                subtotalEl.textContent = '$0.00';
                taxEl.textContent = '$0.00';
                totalEl.textContent = '$0.00';
                checkoutBtn.disabled = true;
                return;
            }

            cartSubtitle.textContent = `${cart.length} item${cart.length !== 1 ? 's' : ''} in your cart`;
            checkoutBtn.disabled = false;

            container.innerHTML = `
                <div class="items-header">Items in Cart</div>
                ${cart.map(item => `
                    <div class="cart-item">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-content">
                            <div class="item-title">${item.title}</div>
                            <span class="item-type">${item.type}</span>
                            <div class="item-option">
                                ${item.optionLabel} ${item.quantity > 1 ? `× ${item.quantity}` : ''}
                            </div>
                            <div class="item-price">${formatPrice(item.price * item.quantity)}</div>
                        </div>
                        <button class="item-remove" onclick="removeFromCart('${item.id}')">Remove</button>
                    </div>
                `).join('')}
            `;

            const totals = calculateTotals();
            subtotalEl.textContent = formatPrice(totals.subtotal * 100);
            taxEl.textContent = formatPrice(totals.tax * 100);
            totalEl.textContent = formatPrice(totals.total * 100);
        }

        function goToCheckout() {
            window.location.href = '/checkout-sxexet';
        }

        function continueShopping() {
            window.location.href = '/offerings';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
